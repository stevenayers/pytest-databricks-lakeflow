site_name: pytest-databricks-lakeflow
site_description: Test the Lakeflow Jobs in your Databricks Asset Bundle with plain pytest.
site_url: https://stevenayers.github.io/pytest-databricks-lakeflow/
repo_url: https://github.com/stevenayers/pytest-databricks-lakeflow
repo_name: stevenayers/pytest-databricks-lakeflow
edit_uri: edit/main/docs/
copyright: Apache-2.0

# Maintainer notes and stray files that live in docs/ but are not part of the site.
exclude_docs: |
  SPEC.md
  notes.md
  *.log

# A broken page link or heading anchor fails `mkdocs build --strict`.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  # Light and dark palettes. The first entry follows the system setting, and the toggle cycles through the three.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.top
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - AI coding agents: agents.md
  - Job tests: job-tests.md
  - Task tests: task-tests.md
  - Recipes:
      - recipes/index.md
      - Change the job settings: recipes/job-settings.md
      - Control the run: recipes/runs.md
      - Task types: recipes/task-types.md
      - Test data: recipes/data.md
      - Debug a failure: recipes/debugging.md
      - Compute and cost: recipes/compute.md
      - Bundle deployments: recipes/deployments.md
      - CI and housekeeping: recipes/ci.md
  - Reference:
      - Lakeflow arguments: reference/lakeflow.md
      - Command-line flags and environment variables: reference/flags.md
      - Logs and reports: reference/output.md
      - API: reference/api.md
      - Limitations: reference/limitations.md
  - FAQ: faq.md
  - How it works: how-it-works.md
  - Speed and cost: speed.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true
            show_signature_annotations: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]
