resources:
  jobs:
    sql_job:
      name: sql_job
      description: SQL task job for the pytest-databricks-lakeflow integration tests.
      parameters:
        - name: n
          default: "3"
      tasks:
        - task_key: query
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/queries/count.sql
        - task_key: types
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/queries/types.sql
        - task_key: wide
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/queries/wide.sql
        - task_key: parameterised
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              n: "{{job.parameters.n}}"
            file:
              path: ../src/queries/parameterised.sql
        - task_key: labelled
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              label: from-bundle
            file:
              path: ../src/queries/labelled.sql
        - task_key: use_results
          depends_on:
            - task_key: query
            - task_key: types
          notebook_task:
            notebook_path: ../src/notebooks/use_results.py
            base_parameters:
              count: "{{tasks.query.output.first_row.n}}"
              row: "{{tasks.types.output.first_row}}"
              rows: "{{tasks.types.output.rows}}"
