bundle:
  name: lakeflow_example

include:
  - resources/*.yml

artifacts:
  # No dynamic_version, so test_example.py can check the strict_artifacts error against the real bundle summary.
  lakeflow_example:
    type: whl
    build: uv build --wheel
    path: .

targets:
  test:
    mode: development
    default: true
    workspace:
      root_path: ~/.bundle/${bundle.name}/test
    # Checked against the deploying identity before `bundle deploy`, see test_run_as_self_passes_the_pre_deploy_check.
    run_as:
      user_name: ${workspace.current_user.userName}
    presets:
      trigger_pause_status: PAUSED
      tags:
        purpose: pytest
