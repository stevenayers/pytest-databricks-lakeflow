resources:
  jobs:
    cluster_job:
      name: cluster_job
      description: Classic compute job for the pytest-databricks-lakeflow integration tests.
      job_clusters:
        - job_cluster_key: main
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_D4s_v5
            num_workers: 1
            data_security_mode: SINGLE_USER
      tasks:
        - task_key: hello
          job_cluster_key: main
          notebook_task:
            notebook_path: ../src/notebooks/hello.py
