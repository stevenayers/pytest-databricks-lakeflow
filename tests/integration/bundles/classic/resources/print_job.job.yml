resources:
  jobs:
    print_job:
      name: print_job
      description: Prints to stdout and stderr on two classic runtimes, to check the shape of the exported notebook.
      job_clusters:
        - job_cluster_key: main
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_D4s_v5
            num_workers: 1
            data_security_mode: SINGLE_USER
        # The oldest LTS runtime the workspace lists, on its own cluster so both tasks start in parallel.
        - job_cluster_key: lts
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: Standard_D4s_v5
            num_workers: 1
            data_security_mode: SINGLE_USER
      tasks:
        - task_key: printer
          job_cluster_key: main
          notebook_task:
            notebook_path: ../src/notebooks/printer.py
        - task_key: printer_lts
          job_cluster_key: lts
          notebook_task:
            notebook_path: ../src/notebooks/printer.py
