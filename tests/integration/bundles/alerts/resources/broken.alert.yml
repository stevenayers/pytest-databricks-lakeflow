# Evaluates a query that always fails, so the alert cannot be evaluated: the alert task fails and reports the state
# ERROR. It has no notification subscriptions and its schedule is paused, so it evaluates only when an alert task
# runs it.
resources:
  alerts:
    broken:
      display_name: pytest alert broken
      query_text: SELECT raise_error('boom') AS n
      warehouse_id: ${var.warehouse_id}
      evaluation:
        source:
          name: n
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 0
      schedule:
        quartz_cron_schedule: "0 0 0 1 1 ?"
        timezone_id: UTC
        pause_status: PAUSED
