[project]
name = "pytest-databricks-lakeflow"
version = "0.15.0"
description = "Run Lakeflow Jobs from a Databricks Asset Bundle as throwaway jobs inside pytest tests."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Steven Ayers", email = "steven@ayers.io" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
keywords = ["pytest", "databricks", "lakeflow", "asset-bundles", "testing"]
dependencies = [
    "pytest>=8",
    "databricks-sdk>=0.100",
    "filelock>=3",
]

[project.urls]
Homepage = "https://github.com/stevenayers/pytest-databricks-lakeflow"
Documentation = "https://stevenayers.github.io/pytest-databricks-lakeflow/"
Changelog = "https://github.com/stevenayers/pytest-databricks-lakeflow/blob/main/CHANGELOG.md"
Source = "https://github.com/stevenayers/pytest-databricks-lakeflow"
Issues = "https://github.com/stevenayers/pytest-databricks-lakeflow/issues"
"Agent skill" = "https://github.com/stevenayers/pytest-databricks-lakeflow/tree/main/skills/pytest-databricks-lakeflow"
"llms.txt" = "https://stevenayers.github.io/pytest-databricks-lakeflow/llms.txt"

[project.scripts]
lakeflow-skill = "pytest_databricks_lakeflow.skill:main"

[project.entry-points.pytest11]
databricks_lakeflow = "pytest_databricks_lakeflow.plugin"

[dependency-groups]
audit = [
    "pip-audit>=2.9",
]
dev = [
    # For the integration tests' Connect cases. Releases before 16.2 pin numpy<2, which has no wheels for Python 3.13 or
    # later, and 16.2 onwards declare Python 3.12 only, so no release installs on 3.13 or 3.14.
    "databricks-connect>=15.1; python_version < '3.13'",
    "pytest-cov>=6",
    "pytest-xdist>=3",
    "ruff>=0.5",
    "ty==0.0.89",
]
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_databricks_lakeflow"]

[tool.hatch.build.targets.wheel.force-include]
"skills/pytest-databricks-lakeflow" = "pytest_databricks_lakeflow/skills/pytest-databricks-lakeflow"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "skills", "scripts/check_skill.py", ".claude-plugin", "llms.txt", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D"]
# Docstrings are only required on the public API, so the missing-docstring rules are off.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/integration/bundles/*/src/notebooks/*.py" = ["F821"]
"tests/integration/notebooks/*.py" = ["F821"]

[tool.ty.src]
include = ["src", "tests"]
# Notebooks use platform globals such as dbutils and spark.
exclude = ["tests/integration/bundles", "tests/integration/notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/pytest_databricks_lakeflow"]
